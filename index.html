const catMeta = {
  BASE: { label: "BASE 80/20", dot: "bg-sky-400", ring: "ring-sky-500/30", text: "text-sky-200" },
  IT: { label: "SISTEMAS IT", dot: "bg-emerald-400", ring: "ring-emerald-500/30", text: "text-emerald-200" },
  PERFUMES: { label: "AION PERFUMES", dot: "bg-amber-400", ring: "ring-amber-500/30", text: "text-amber-200" },
};

function Flashcard({ w }) {
  const [flipped, setFlipped] = useState(false);
  return (
    <div className="perspective">
      <div
        onClick={() => setFlipped(!flipped)}
        className={`relative w-full min-h-[220px] cursor-pointer preserve-3d transition-transform duration-700 ${flipped? "rotate-y-180" : ""} rounded-[18px] border border-white/10 bg-[#111116] hover:border-white/20 shadow-[0_10px_30px_rgba(0,0,0,0.4)]`}
      >
        <div className="absolute inset-0 backface-hidden p-5 flex flex-col justify-between rounded-[18px]">
          <div className="flex justify-between items-start">
            <span className={`mono text-[10px] tracking-widest px-2.5 py-1 rounded-full border bg-black/40 ${catMeta[w.cat].text} border-white/10`}>{catMeta[w.cat].label}</span>
            <span className="mono text-[11px] text-zinc-500">{w.phonetic}</span>
          </div>
          <div>
            <div className="text-[32px] font-black tracking-tight leading-none">{w.en}</div>
            <div className="mt-2 mono text-[11px] text-zinc-400">Toca para memorizar · técnica absurda</div>
          </div>
          <div className="flex items-center gap-2 mono text-[10px] text-zinc-500">
            <div className={`w-1.5 h-1.5 rounded-full ${catMeta[w.cat].dot}`} /> {w.cat} · IF12
          </div>
        </div>
        <div className="absolute inset-0 backface-hidden rotate-y-180 p-5 flex flex-col justify-between rounded-[18px] bg-[#15151c] border border-white/10">
          <div>
            <div className="flex justify-between">
              <div className="text-[13px] font-bold text-zinc-200">{w.es}</div>
              <div className="mono text-[10px] text-zinc-500">{w.en}</div>
            </div>
            <div className="mt-3 rounded-xl bg-black/40 border border-white/[0.06] p-3">
              <div className="mono text-[9px] tracking-widest text-violet-300 mb-1">IMAGEN ABSURDA · MEMORIA</div>
              <div className="text-[12px] leading-[1.45] text-zinc-200">{w.absurd}</div>
            </div>
            <div className="mt-3 space-y-2">
              <div className="text-[11px] leading-[1.4]"><span className="mono text-[9px] text-emerald-300">IT:</span> <span className="text-zinc-300">{w.exWork}</span></div>
              <div className="text-[11px] leading-[1.4]"><span className="mono text-[9px] text-amber-300">AION:</span> <span className="text-zinc-300">{w.exBase}</span></div>
            </div>
          </div>
          <div className="mono text-[10px] text-zinc-500">Toca para volver · Di al revés para retener</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [activeDay, setActiveDay] = useState(1);
  const [completed, setCompleted] = useState(new Set());
  const day = useMemo(() => days.find(d => d.n === activeDay), [activeDay]);
  const grouped = useMemo(() => {
    const g = { BASE: [], IT: [], PERFUMES: [] };
    day.words.forEach(w => g[w.cat].push(w));
    return g;
  }, [day]);

  const toggleComplete = () => {
    const n = new Set(completed);
    if (n.has(activeDay)) n.delete(activeDay); else n.add(activeDay);
    setCompleted(n);
  };

  const progress = (completed.size / 7) * 100;

  return (
    <div className="min-h-screen bg-[#08080a] selection:bg-violet-500/30">
      <div className="sticky top-0 z-30 backdrop-blur-xl bg-[#08080a]/80 border-b border-white/[0.06]">
        <div className="mx-auto max-w-[1280px] px-6 md:px-8 py-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div className="flex items-center gap-4">
            <div className="w-10 h-10 rounded-[12px] bg-white text-black grid place-items-center font-black text-[13px] tracking-tighter">IF12</div>
            <div>
              <div className="text-[13px] tracking-[0.22em] font-black">PROTOCOLO HOLLYWOOD IF12 // SISTEMAS x AION</div>
              <div className="mono text-[11px] text-zinc-500 -mt-0.5">77 palabras · 7 días · 30 min/día · Edición CDMX</div>
            </div>
          </div>
          <div className="flex items-center gap-4">
            <div className="w-[180px]">
              <div className="flex justify-between mono text-[10px] text-zinc-500 mb-1.5"><span>PROGRESO</span><span>{Math.round(progress)}%</span></div>
              <div className="h-1.5 rounded-full bg-white/10 overflow-hidden"><div className="h-full bg-white transition-all" style={{width: `${progress}%`}} /></div>
            </div>
            <div className="hidden md:flex items-center gap-2 mono text-[10px] text-zinc-400"><div className="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]" />{completed.size}/7 días</div>
          </div>
        </div>
        <div className="mx-auto max-w-[1280px] px-6 md:px-8 pb-4 flex gap-2 overflow-x-auto scrollbar-none">
          {days.map(d => (
            <button key={d.n} onClick={() => setActiveDay(d.n)} className={`shrink-0 px-4 py-2.5 rounded-full border mono text-[12px] font-bold tracking-wide transition-all ${activeDay===d.n? "bg-white text-black border-white shadow-[0_0_20px_rgba(255,255,255,0.2)]" : completed.has(d.n)? "bg-emerald-500/15 text-emerald-200 border-emerald-500/30" : "bg-white/[0.04] text-zinc-400 border-white/10 hover:bg-white/[0.08]"}`}>DÍA {d.n} {completed.has(d.n)? "✓" : ""}</button>
          ))}
        </div>
      </div>

      <div className="mx-auto max-w-[1280px] px-6 md:px-8 py-8">
        <div className="rounded-[28px] bg-gradient-to-br from-[#14141a] to-[#0c0c10] border border-white/[0.08] p-6 md:p-8 flex flex-col md:flex-row md:items-end justify-between gap-6">
          <div>
            <div className="mono text-[11px] tracking-[0.2em] text-violet-300">DÍA {day.n} · {day.theme.toUpperCase()}</div>
            <h1 className="mt-2 text-[30px] md:text-[42px] font-black leading-[0.9] tracking-tight">
              {day.n === 1 && "Yo quiero tener aroma y servidor."}
              {day.n === 2 && "Nosotros ayudamos a vender fragancia."}
              {day.n === 3 && "Vamos a hacer respaldo del cliente."}
              {day.n === 4 && "Puedo dar acceso aquí y ahora."}
              {day.n === 5 && "Muy buen problema con reporte fresco."}
              {day.n === 6 && "La gente usa nube para comprar tienda."}
              {day.n === 7 && "Por favor entiende el lote más vendido."}
            </h1>
            <div className="mt-3 flex flex-wrap gap-2">
              <span className="px-3 py-1 rounded-full bg-sky-500/15 border border-sky-500/30 text-sky-200 text-xs">BASE 5 palabras</span>
              <span className="px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-200 text-xs">IT 3 palabras</span>
              <span className="px-3 py-1 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-200 text-xs">AION 3 palabras</span>
            </div>
          </div>
          <div className="flex gap-3">
            <div className="rounded-2xl bg-black/40 border border-white/10 px-5 py-4 min-w-[140px]">
              <div className="mono text-[10px] text-zinc-500">PALABRAS HOY</div>
              <div className="text-3xl font-black">11</div>
              <div className="text-[11px] text-zinc-400">5 + 3 + 3 = IF12 split</div>
            </div>
            <div className="rounded-2xl bg-black/40 border border-white/10 px-5 py-4 min-w-[140px]">
              <div className="mono text-[10px] text-zinc-500">ESTADO</div>
              <div className="text-lg font-bold">{completed.has(day.n)? "✓ Completado" : "○ En progreso"}</div>
              <div className="text-[11px] text-zinc-400">Toca las cards para memorizar</div>
            </div>
          </div>
        </div>

        <div className="mt-8 space-y-10">
          {(Object.keys(grouped)).map(cat => (
            <div key={cat}>
              <div className="flex items-center gap-3 mb-4">
                <div className={`w-2 h-2 rounded-full ${catMeta[cat].dot} shadow-[0_0_10px_currentColor]`} />
                <h2 className="mono text-[12px] tracking-[0.18em] font-bold">{catMeta[cat].label} · {grouped[cat].length}</h2>
                <div className="h-px flex-1 bg-gradient-to-r from-white/10 to-transparent ml-2" />
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-5">
                {grouped[cat].map(w => (
                  <Flashcard key={w.en + day.n} w={w} />
                ))}
              </div>
            </div>
          ))}
        </div>

        <div className="mt-12 rounded-[24px] bg-[#0f0f14] border border-white/10 p-6 md:p-8">
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              <div className="mono text-[11px] tracking-widest text-zinc-500">RUTINA IF12 · 30 MINUTOS</div>
              <h3 className="text-[22px] font-black tracking-tight mt-1">Sin gramática. Solo imagen + sonido + voz.</h3>
            </div>
            <div className="mono text-[11px] text-zinc-400">Método: Memoria → Percepción → Speaking</div>
          </div>

          <div className="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            {[
              { t: "10' MEMORIA", d: "Ver frente, crear imagen absurda, decir al revés (ES→EN). No escribas.", c: "from-violet-600/20 to-zinc-900", icon: "🧠" },
              { t: "10' PERCEPCIÓN", d: "Escucha la palabra sin traducir. Solo reconoce el sonido. Repite fonética.", c: "from-fuchsia-600/20 to-zinc-900", icon: "👂" },
              { t: "10' SPEAKING", d: "Di la frase IT/AION en voz alta sin traducir palabra por palabra. Flujo > perfección.", c: "from-amber-500/20 to-zinc-900", icon: "🎙️" },
            ].map(b => (
              <div key={b.t} className={`rounded-2xl bg-gradient-to-br ${b.c} border border-white/10 p-5`}>
                <div className="text-[11px] mono tracking-widest font-bold flex items-center gap-2"><span className="text-lg">{b.icon}</span>{b.t}</div>
                <div className="mt-3 text-[13px] leading-[1.5] text-zinc-300">{b.d}</div>
              </div>
            ))}
          </div>

          <div className="mt-6 flex flex-col md:flex-row gap-3 items-start md:items-center justify-between">
            <div className="mono text-[11px] text-zinc-500">Tip AION: Usa las frases en tu WhatsApp de clientes + ticket de soporte hoy.</div>
            <button
              onClick={toggleComplete}
              className={`px-6 py-3 rounded-full font-bold text-[13px] tracking-wide transition-all border ${completed.has(activeDay)? "bg-emerald-500 text-black border-emerald-400 shadow-[0_0_20px_rgba(16,185,129,0.5)]" : "bg-white text-black border-white hover:shadow-[0_0_20px_rgba(255,255,255,0.3)]"}`}
            >
              {completed.has(activeDay)? "✓ DÍA COMPLETADO · Desmarcar" : `MARCAR DÍA ${activeDay} COMO COMPLETADO`}
            </button>
          </div>
        </div>

        <div className="mt-10 mb-16 rounded-[20px] bg-gradient-to-br from-zinc-900 to-black border border-white/[0.06] p-6">
          <div className="mono text-[11px] tracking-widest text-zinc-500">PROTOCOLO ANTI-BLOQUEO IF12</div>
          <div className="mt-4 grid md:grid-cols-3 gap-3">
            <div className="rounded-xl bg-white/[0.03] border border-white/[0.06] p-4">
              <div className="text-[12px] font-bold text-white">Error 1: Gramática antes que vocabulario</div>
              <div className="mt-1 text-[12px] text-zinc-400 leading-[1.5]">→ Primero palabras. Las 77 palabras son tu sistema operativo. Sin vocab, no hay deploy.</div>
            </div>
            <div className="rounded-xl bg-white/[0.03] border border-white/[0.06] p-4">
              <div className="text-[12px] font-bold text-white">Error 4: No retener</div>
              <div className="mt-1 text-[12px] text-zinc-400 leading-[1.5]">→ Usa imagen absurda. Cuanto más ridícula (server sirviendo perfumes), más se queda.</div>
            </div>
            <div className="rounded-xl bg-white/[0.03] border border-white/[0.06] p-4">
              <div className="text-[12px] font-bold text-white">Error 5: Percepción</div>
              <div className="mt-1 text-[12px] text-zinc-400 leading-[1.5]">→ Escucha sin traducir. Reconoce sonido como reconoces 'AION' sin deletrear.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
