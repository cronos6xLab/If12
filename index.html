    const g = { BASE: [], IT: [], PERFUMES: [] };
    day.words.forEach(w => g[w.cat].push(w));
    return g;
  }, [day]);

  const toggleComplete = () => {
    setCompleted(prev => prev.includes(activeDay) ? prev.filter(n => n !== activeDay) : [...prev, activeDay]);
  };

  const progress = (completed.length / 7) * 100;

  const headline = {
    1: "Yo quiero tener aroma y servidor.",
    2: "Nosotros ayudamos a vender fragancia.",
    3: "Vamos a hacer respaldo del cliente.",

    5: "Muy buen problema con reporte fresco.",
    6: "La gente usa nube para comprar tienda.",
    7: "Por favor entiende el lote más vendido.",

    <div className="min-h-screen bg-[#08080a]">

              }`}
            >
              DÍA {d.n} {completed.includes(d.n) ? "✓" : ""}
            </button>
          ))}
        </div>
      </div>

      <div className="mx-auto max-w-[1280px] px-6 md:px-8 py-8">
        <div className="rounded-[28px] bg-gradient-to-br from-[#14141a] to-[#0c0c10] border border-white/[0.08] p-6 md:p-8 flex flex-col md:flex-row md:items-end justify-between gap-6">
          <div>
            <div className="mono text-[11px] tracking-[0.2em] text-violet-300">
              DÍA {day.n} · {day.theme.toUpperCase()}
            </div>
            <h1 className="mt-2 text-[30px] md:text-[42px] font-black leading-[0.95] tracking-tight">
              {headline}
            </h1>
            <div className="mt-3 flex flex-wrap gap-2">
              <span className="px-3 py-1 rounded-full bg-sky-500/15 border border-sky-500/30 text-sky-200 text-xs">BASE {grouped.BASE.length} palabras</span>
              <span className="px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-200 text-xs">IT {grouped.IT.length} palabras</span>
              <span className="px-3 py-1 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-200 text-xs">AION {grouped.PERFUMES.length} palabras</span>
            </div>
          </div>
          <div className="flex gap-3">
            <div className="rounded-2xl bg-black/40 border border-white/10 px-5 py-4 min-w-[140px]">
              <div className="mono text-[10px] text-zinc-500">PALABRAS HOY</div>
              <div className="text-3xl font-black">{day.words.length}</div>
              <div className="text-[11px] text-zinc-400">split IF12</div>
            </div>
            <div className="rounded-2xl bg-black/40 border border-white/10 px-5 py-4 min-w-[140px]">
              <div className="mono text-[10px] text-zinc-500">ESTADO</div>
              <div className="text-lg font-bold">{isDone ? "✓ Completado" : "○ En progreso"}</div>
              <div className="text-[11px] text-zinc-400">Toca las cards</div>
            </div>
          </div>
        </div>

        <div className="mt-8 space-y-10">
          {["BASE","IT","PERFUMES"].map(cat => (
            <div key={cat}>
              <div className="flex items-center gap-3 mb-4">
                <div className={`w-2 h-2 rounded-full ${catMeta[cat].dot}`} />
                <h2 className="mono text-[12px] tracking-[0.18em] font-bold">
                  {catMeta[cat].label} · {grouped[cat].length}
                </h2>
                <div className="h-px flex-1 bg-gradient-to-r from-white/10 to-transparent ml-2" />
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-5">
                {grouped[cat].map(w => (
                  <Flashcard key={w.en + day.n} w={w} />
                ))}
              </div>
            </div>
          ))}
        </div>

        <div className="mt-12 rounded-[24px] bg-[#0f0f14] border border-white/10 p-6 md:p-8">
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              <div className="mono text-[11px] tracking-widest text-zinc-500">RUTINA IF12 · 30 MINUTOS</div>
              <h3 className="text-[22px] font-black tracking-tight mt-1">Sin gramática. Solo imagen + sonido + voz.</h3>
            </div>
            <div className="mono text-[11px] text-zinc-400">Método: Memoria → Percepción → Speaking</div>
          </div>

          <div className="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            {[
              { t:"10' MEMORIA", d:"Ver frente, crear imagen absurda, decir al revés (ES→EN). No escribas.", c:"from-violet-600/20 to-zinc-900", icon:"🧠" },
              { t:"10' PERCEPCIÓN", d:"Escucha la palabra sin traducir. Solo reconoce el sonido. Repite fonética.", c:"from-fuchsia-600/20 to-zinc-900", icon:"👂" },
              { t:"10' SPEAKING", d:"Di la frase IT/AION en voz alta sin traducir palabra por palabra. Flujo > perfección.", c:"from-amber-500/20 to-zinc-900", icon:"🎙️" },
            ].map(b => (
              <div key={b.t} className={`rounded-2xl bg-gradient-to-br ${b.c} border border-white/10 p-5`}>
                <div className="text-[11px] mono tracking-widest font-bold flex items-center gap-2">
                  <span className="text-lg">{b.icon}</span>{b.t}
                </div>
                <div className="mt-3 text-[13px] leading-[1.5] text-zinc-300">{b.d}</div>
              </div>
            ))}
          </div>

          <div className="mt-6 flex flex-col md:flex-row gap-3 items-start md:items-center justify-between">
            <div className="mono text-[11px] text-zinc-500">
              Tip AION: Usa las frases en tu WhatsApp de clientes + ticket de soporte hoy.
            </div>
            <button
              onClick={toggleComplete}
              className={`px-6 py-3 rounded-full font-bold text-[13px] tracking-wide transition-all border ${
                isDone
                  ? "bg-emerald-500 text-black border-emerald-400 shadow-[0_0_20px_rgba(16,185,129,0.5)]"
                  : "bg-white text-black border-white hover:shadow-[0_0_20px_rgba(255,255,255,0.3)]"
              }`}
            >
              {isDone ? "✓ DÍA COMPLETADO · Desmarcar" : `MARCAR DÍA ${activeDay} COMO COMPLETADO`}
            </button>
          </div>
        </div>

        <div className="mt-10 mb-16 rounded-[20px] bg-gradient-to-br from-zinc-900 to-black border border-white/[0.06] p-6">
          <div className="mono text-[11px] tracking-widest text-zinc-500">PROTOCOLO ANTI-BLOQUEO IF12</div>
          <div className="mt-4 grid md:grid-cols-3 gap-3">
            <div className="rounded-xl bg-white/[0.03] border border-white/[0.06] p-4">
              <div className="text-[12px] font-bold text-white">Error 1: Gramática antes que vocabulario</div>
              <div className="mt-1 text-[12px] text-zinc-400 leading-[1.5]">→ Primero palabras. Las 77 palabras son tu sistema operativo. Sin vocab, no hay deploy.</div>
            </div>
            <div className="rounded-xl bg-white/[0.03] border border-white/[0.06] p-4">
              <div className="text-[12px] font-bold text-white">Error 4: No retener</div>
              <div className="mt-1 text-[12px] text-zinc-400 leading-[1.5]">→ Usa imagen absurda. Cuanto más ridícula (server sirviendo perfumes), más se queda.</div>
            </div>
            <div className="rounded-xl bg-white/[0.03] border border-white/[0.06] p-4">
              <div className="text-[12px] font-bold text-white">Error 5: Percepción</div>
              <div className="mt-1 text-[12px] text-zinc-400 leading-[1.5]">→ Escucha sin traducir. Reconoce sonido como reconoces 'AION' sin deletrear.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
document.getElementById('boot').classList.add('hide');
</script>

<script>
  // Si tras 8 segundos aún no renderizó, mostrar mensaje útil
  setTimeout(function() {
    var boot = document.getElementById('boot');
    if (boot && !boot.classList.contains('hide')) {
      boot.innerHTML =
        '<div style="text-align:center; max-width: 420px; padding: 20px; line-height:1.6">' +
        '<div style="color:#f87171; font-weight:bold; margin-bottom:10px">⚠ NO CARGÓ</div>' +
        'Parece que no hay conexión a internet o los CDN están bloqueados.<br><br>' +
        'Prueba:<br>1) Abrir con Chrome o Edge<br>2) Verificar conexión<br>3) Desactivar bloqueadores (uBlock, etc.)' +
        '</div>';
    }
  }, 8000);
</script>

</body>
</html>
