<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel de Accesos FoodBot</title>
<style>
  :root{
    --bg:#0f1218;
    --card:#1c222d;
    --card-hover:#232b39;
    --line:#2a3342;
    --txt:#e7ecf3;
    --muted:#8b96a8;
    --accent:#22c55e;
    --accent-2:#16a34a;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#1d2634 0%,var(--bg) 60%);
    color:var(--txt);
    min-height:100vh;
  }

  /* ============ MODO COMPLETO (dashboard) ============ */
  body.mode-full{padding:32px 24px}
  body.mode-full #launcherView{display:none}

  header.main{
    max-width:1100px;margin:0 auto 22px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .logo{
    width:46px;height:46px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),#0ea5e9);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:20px;color:#0b1017;
    box-shadow:0 6px 18px rgba(34,197,94,.35);
    flex:0 0 auto;
  }
  header.main h1{font-size:22px;margin:0;letter-spacing:.3px}
  header.main p{margin:2px 0 0;color:var(--muted);font-size:13px}

  .top-actions{
    max-width:1100px;margin:0 auto 22px;
    display:flex;gap:10px;flex-wrap:wrap;
  }
  .btn{
    border:1px solid var(--line);
    background:#161b24;color:var(--txt);
    padding:10px 16px;border-radius:11px;
    font-size:13.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
    font-family:inherit;
  }
  .btn:hover{background:#1f2734;border-color:#3a475c}
  .btn:active{transform:scale(.97)}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#08130c;border:none;
    box-shadow:0 6px 18px rgba(34,197,94,.35);
  }
  .btn.primary:hover{filter:brightness(1.08)}

  .grid{
    max-width:1100px;margin:0 auto;
    display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    display:flex;flex-direction:column;gap:12px;
    cursor:pointer;
    transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
    text-decoration:none;color:inherit;
    position:relative;overflow:hidden;
    font-family:inherit;text-align:left;
  }
  .card::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(120deg,rgba(34,197,94,.14),transparent 55%);
    opacity:0;transition:opacity .25s ease;pointer-events:none;
  }
  .card:hover{transform:translateY(-4px);background:var(--card-hover);border-color:#3a475c;box-shadow:var(--shadow)}
  .card:hover::after{opacity:1}
  .card:active{transform:translateY(-1px) scale(.99)}
  .icon{
    width:42px;height:42px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    background:#0e141d;border:1px solid var(--line);
    font-size:20px;
  }
  .card h3{margin:0;font-size:15px;line-height:1.3}
  .card small{color:var(--muted);font-size:12px;word-break:break-all}

  /* ============ MODO LANZADOR (ventana pequeña) ============ */
  body.mode-launcher{
    padding:0;
    background:#0d1117;
    overflow:hidden;
  }
  body.mode-launcher #fullView{display:none}

  #launcherView{
    height:100vh;display:flex;flex-direction:column;
    background:#0d1117;
  }
  .launcher-header{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;
    background:linear-gradient(180deg,#161b24,#12161d);
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
    cursor:move;
    user-select:none;
  }
  .launcher-header .logo{width:34px;height:34px;border-radius:9px;font-size:14px}
  .launcher-header .ttl{font-size:13px;font-weight:700;line-height:1.1}
  .launcher-header .sub{font-size:11px;color:var(--muted);margin-top:2px}

  .launcher-list{
    flex:1;overflow-y:auto;
    padding:8px;
    display:flex;flex-direction:column;gap:4px;
  }
  .launcher-list::-webkit-scrollbar{width:8px}
  .launcher-list::-webkit-scrollbar-thumb{background:#334055;border-radius:8px}

  .launcher-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 10px;
    border:1px solid transparent;
    background:transparent;
    color:var(--txt);
    border-radius:10px;
    font-family:inherit;font-size:13px;font-weight:500;
    text-align:left;cursor:pointer;
    transition:background .12s ease,border-color .12s ease,transform .12s ease;
    width:100%;
  }
  .launcher-item:hover{background:#1c222d;border-color:var(--line)}
  .launcher-item:active{transform:scale(.98)}
  .launcher-item .ico{
    width:28px;height:28px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:#0e141d;border:1px solid var(--line);
    border-radius:8px;font-size:14px;
  }
  .launcher-item .ttl{flex:1;line-height:1.25}

  .launcher-footer{
    flex:0 0 auto;
    padding:8px;
    border-top:1px solid var(--line);
    background:#0f141c;
    display:flex;gap:8px;
  }
  .launcher-footer .btn{flex:1;justify-content:center;font-size:12px;padding:8px 10px}

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:#1c222d;border:1px solid var(--line);
    padding:10px 16px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:100000;
    box-shadow:var(--shadow);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:520px){
    body.mode-full{padding:20px 14px}
  }
</style>
</head>
<body>

<!-- ================================================== -->
<!-- ============ VISTA COMPLETA (DASHBOARD) =========== -->
<!-- ================================================== -->
<div id="fullView">
  <header class="main">
    <div class="logo">FB</div>
    <div>
      <h1>Panel de Accesos · FoodBot Admin</h1>
      <p>Los accesos se abren en <b>nueva pestaña real</b> para conservar tu sesión iniciada. Usa el lanzador flotante para tenerlos siempre a la mano.</p>
    </div>
  </header>

  <div class="top-actions">
    <button class="btn primary" id="btnOpenLauncher">
      📌 Abrir lanzador flotante
    </button>
    <button class="btn" id="btnOpenAll" title="Abre cada acceso en su propia pestaña">
      🚀 Abrir todos en pestañas
    </button>
    <button class="btn" id="btnCopyList" title="Copia la lista completa de URLs">
      📋 Copiar lista de URLs
    </button>
  </div>

  <main class="grid" id="grid"></main>
</div>

<!-- ================================================== -->
<!-- ============ VISTA LANZADOR (VENTANA) ============= -->
<!-- ================================================== -->
<div id="launcherView">
  <div class="launcher-header">
    <div class="logo">FB</div>
    <div style="flex:1">
      <div class="ttl">Accesos FoodBot</div>
      <div class="sub">Clic → nueva pestaña · Sesión conservada</div>
    </div>
  </div>
  <div class="launcher-list" id="launcherList"></div>
  <div class="launcher-footer">
    <button class="btn" id="btnOpenDashboard">🖥 Panel completo</button>
    <button class="btn" id="btnCloseLauncher">✕ Cerrar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   CONFIGURACIÓN DE ACCESOS
   ================================================================ */
const ACCESOS = [
  { titulo:"Fullfil a requisición",                     url:"https://admin.foodbot.ai/inventory/supplier-po",            icono:"📦" },
  { titulo:"Validar auditorías pendientes",             url:"https://admin.foodbot.ai/inventory/audit?tab=pending",      icono:"✅" },
  { titulo:"Calendario de requisiciones y compras",     url:"https://admin.foodbot.ai/inventory/po-calendar",            icono:"📅" },
  { titulo:"Configuración y creación de productos",     url:"https://admin.foodbot.ai/menu/product",                     icono:"🍔" },
  { titulo:"Configuración y creación de usuarios",      url:"https://admin.foodbot.ai/restaurant_details/manage_users",  icono:"👥" },
  { titulo:"Configuración y creación de menús visibles",url:"https://admin.foodbot.ai/menu?tab=menu",                    icono:"📋" },
  { titulo:"Disponibilidad de productos en ubicaciones",url:"https://admin.foodbot.ai/menu/menu-availability",           icono:"📍" },
  { titulo:"Recetas",                                   url:"https://admin.foodbot.ai/inventory/recipes",                icono:"📖" },
  { titulo:"Modificadores",                             url:"https://admin.foodbot.ai/menu/modifierCategory",            icono:"🧩" },
  { titulo:"Órdenes de traslado y compras",             url:"https://admin.foodbot.ai/inventory/supplier-po",            icono:"🔄" },
];

const LAUNCHER_NAME = 'fb_launcher_window';
const esModoLanzador = location.hash === '#launcher';

/* ================================================================
   ABRIR ENLACE
   Se usa window.open con '_blank' para que el navegador lo trate
   como navegación de PRIMER NIVEL → las cookies de sesión viajan
   correctamente y NO pide iniciar sesión de nuevo.
   ================================================================ */
function abrirAcceso(item){
  const w = window.open(item.url, '_blank', 'noopener');
  if (!w) {
    mostrarToast('Permite ventanas emergentes para abrir el acceso');
  } else {
    mostrarToast(`Abriendo: ${item.titulo}`);
  }
}

/* ================================================================
   MODO COMPLETO — Dashboard
   ================================================================ */
function renderDashboard(){
  const grid = document.getElementById('grid');
  ACCESOS.forEach(item => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.innerHTML = `
      <div class="icon">${item.icono}</div>
      <h3>${item.titulo}</h3>
      <small>${item.url.replace('https://','')}</small>
    `;
    card.addEventListener('click', ()=> abrirAcceso(item));
    // Clic derecho → menú nativo con "abrir en nueva pestaña"
    card.addEventListener('contextmenu', (e)=>{
      // Dejamos que el navegador muestre su menú por defecto (no hacemos nada)
    });
    grid.appendChild(card);
  });
}

document.getElementById('btnOpenLauncher').addEventListener('click', abrirLanzador);

document.getElementById('btnOpenAll').addEventListener('click', ()=>{
  ACCESOS.forEach((item, i)=>{
    setTimeout(()=> window.open(item.url, '_blank', 'noopener'), i * 220);
  });
  mostrarToast('Abriendo todos los accesos…');
});

document.getElementById('btnCopyList').addEventListener('click', async ()=>{
  const txt = ACCESOS.map(a => `${a.titulo}\n${a.url}`).join('\n\n');
  try {
    await navigator.clipboard.writeText(txt);
    mostrarToast('Lista copiada al portapapeles');
  } catch {
    mostrarToast('No se pudo copiar automáticamente');
  }
});

/* ================================================================
   MODO LANZADOR — Ventana flotante pequeña
   ================================================================ */
function renderLauncher(){
  const list = document.getElementById('launcherList');
  ACCESOS.forEach(item => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'launcher-item';
    b.innerHTML = `
      <span class="ico">${item.icono}</span>
      <span class="ttl">${item.titulo}</span>
    `;
    b.addEventListener('click', ()=> abrirAcceso(item));
    list.appendChild(b);
  });

  document.getElementById('btnCloseLauncher').addEventListener('click', ()=> window.close());

  document.getElementById('btnOpenDashboard').addEventListener('click', ()=>{
    const base = location.href.split('#')[0];
    window.open(base, '_blank', 'noopener');
  });
}

/* ================================================================
   ABRIR LANZADOR (ventana pequeña flotante en pantalla)
   ================================================================ */
function abrirLanzador(){
  // Si ya existe y sigue abierta → enfocar
  const existente = window.open('', LAUNCHER_NAME);
  if (existente && !existente.closed) {
    try { existente.focus(); } catch(e){}
    // Si está abierta pero en otra URL, la recargamos al hash correcto
    try {
      if (!existente.location.href.includes('#launcher')) {
        existente.location.href = location.pathname + '#launcher';
      }
    } catch(e){}
    return;
  }

  // Calcular posición: pegado al borde derecho
  const w = 380;
  const h = Math.min(720, Math.max(480, screen.availHeight - 120));
  const left = Math.max(0, (screen.availWidth || 1280) - w - 24);
  const top  = 60;

  const url = location.pathname + '#launcher';
  const features = [
    `width=${w}`,
    `height=${h}`,
    `left=${left}`,
    `top=${top}`,
    'resizable=yes',
    'scrollbars=yes',
    'menubar=no',
    'toolbar=no',
    'location=no',
    'status=no'
  ].join(',');

  const win = window.open(url, LAUNCHER_NAME, features);
  if (!win) {
    alert('El navegador bloqueó la ventana emergente.\n\nPermite las ventanas emergentes para este sitio y vuelve a intentarlo.');
  } else {
    win.focus();
  }
}

/* ================================================================
   BOOTSTRAP — Elegir qué vista renderizar según el hash
   ================================================================ */
if (esModoLanzador){
  document.body.classList.add('mode-launcher');
  renderLauncher();
} else {
  document.body.classList.add('mode-full');
  renderDashboard();
}

/* ================================================================
   TOAST
   ================================================================ */
let toastTimer;
function mostrarToast(msg){
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 1800);
}
</script>
</body>
</html>
